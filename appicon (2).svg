<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#081226"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Car Paint -->
    <linearGradient id="carPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDEBFF"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Soft Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="512" cy="470" r="300" fill="url(#centerGlow)"/>

  <!-- Orbit Rings -->
  <g opacity="0.7" filter="url(#glow)">
    <ellipse cx="512" cy="450" rx="320" ry="145"
             transform="rotate(28 512 450)"
             stroke="url(#orbitStroke)"
             stroke-width="18"
             fill="none"/>

    <ellipse cx="512" cy="450" rx="320" ry="145"
             transform="rotate(-28 512 450)"
             stroke="url(#orbitStroke)"
             stroke-width="18"
             fill="none"/>

    <ellipse cx="512" cy="450" rx="320" ry="145"
             transform="rotate(90 512 450)"
             stroke="url(#orbitStroke)"
             stroke-width="14"
             opacity="0.75"
             fill="none"/>
  </g>

  <!-- Orbit Dots -->
  <circle cx="770" cy="300" r="20" fill="#A78BFA"/>
  <circle cx="680" cy="750" r="20" fill="#67E8F9"/>
  <circle cx="250" cy="650" r="20" fill="#7DD3FC"/>
  <circle cx="350" cy="210" r="20" fill="#93C5FD"/>

  <!-- OD TEXT -->
  <g filter="url(#shadow)">
    <text x="512"
          y="530"
          text-anchor="middle"
          font-family="Poppins, Arial, sans-serif"
          font-size="290"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="-18">
      OD
    </text>
  </g>

  <!-- MODERN CAR -->
  <g transform="translate(250 585)" filter="url(#shadow)">

    <!-- Main Car Shape -->
    <path d="
      M90 135
      C105 95 145 60 210 55
      L320 48
      C375 45 420 70 455 115
      L500 130
      C520 137 532 150 535 170
      L540 210
      C543 232 528 245 505 245
      H45
      C20 245 5 230 8 205
      L15 175
      C20 150 40 138 62 135
      Z"
      fill="url(#carPaint)"/>

    <!-- Roof / Windows -->
    <path d="
      M190 72
      L315 68
      C355 66 385 82 412 118
      H145
      C155 92 170 78 190 72
      Z"
      fill="#102A63"/>

    <!-- Front Windshield Highlight -->
    <path d="
      M330 75
      C360 76 382 88 405 115
      H315
      Z"
      fill="#1E40AF"
      opacity="0.55"/>

    <!-- Side Window -->
    <path d="
      M180 78
      H300
      L285 118
      H150
      C158 96 166 84 180 78
      Z"
      fill="#1E3A8A"
      opacity="0.9"/>

    <!-- Door Line -->
    <line x1="285" y1="118" x2="285" y2="205"
          stroke="#BFD7FF"
          stroke-width="4"
          opacity="0.5"/>

    <!-- Headlight -->
    <rect x="485" y="150" width="28" height="12" rx="6"
          fill="#67E8F9"/>

    <!-- Rear Light -->
    <rect x="28" y="150" width="14" height="20" rx="5"
          fill="#93C5FD"/>

    <!-- Wheels -->
    <g>
      <circle cx="145" cy="245" r="44" fill="#0F172A"/>
      <circle cx="145" cy="245" r="18" fill="#67E8F9"/>
    </g>

    <g>
      <circle cx="405" cy="245" r="44" fill="#0F172A"/>
      <circle cx="405" cy="245" r="18" fill="#67E8F9"/>
    </g>

  </g>

  <!-- BRAND NAME -->
  <text x="512"
        y="920"
        text-anchor="middle"
        font-family="Poppins, Arial, sans-serif"
        font-size="56"
        font-weight="700"
        fill="#E5F0FF"
        letter-spacing="8">
    ORBIT DISPATCH
  </text>

</svg>